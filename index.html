<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Pokédex Finder</h1>
        <p>Search any Pokémon to view its official sprite and stats.</p>
    </header>

    <main>
        <section aria-labelledby="search-heading">
            <h2 id="search-heading">Search Pokémon</h2>
            <label for="pokemonName">Pokémon Name:</label>
            <input type="text" id="pokemonName" placeholder="Enter Pokémon Name">
            <button type="button" onclick="fetchData()">Fetch Pokémon</button>
        </section>

        <section aria-labelledby="result-heading">
            <h2 id="result-heading">Pokémon Details</h2>
            <article id="pokemonResult">
                <p>Enter a Pokémon name above and click Fetch Pokémon.</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Data provided by PokéAPI</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
